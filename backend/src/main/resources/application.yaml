spring:
  application:
    name: backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

app:
  cors:
    allowed-origin: ${APP_CORS_ALLOWED_ORIGIN:}
  security:
    jwt:
      secret: ${JWT_SECRET:dev-jwt-secret-key-dev-jwt-secret-key-32}
      expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
  bootstrap:
    admin:
      username: ${BOOTSTRAP_ADMIN_USERNAME:admin}
      email: ${BOOTSTRAP_ADMIN_EMAIL:admin@local.dev}
      password: ${BOOTSTRAP_ADMIN_PASSWORD:admin12345}
